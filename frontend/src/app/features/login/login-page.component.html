<section class="login-wrap">
  <div class="login-hero">
    <p class="login-kicker">Modo táctico</p>
    <h1>Centro de mando</h1>
    <p class="login-copy">
      Acceso rápido para administrar empleados y departamentos en una interfaz oscura, limpia y precisa.
    </p>
    <p class="login-tag">Sistema de gestión con enfoque operativo.</p>
  </div>

  <form class="card" [formGroup]="form" (ngSubmit)="submit()">
    <h2>Iniciar sesion</h2>

    <label for="email">Correo</label>
    <input id="email" type="email" formControlName="email" autocomplete="email" />

    <label for="password">Contrasena</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="submit" [disabled]="isSubmitting">Entrar</button>
  </form>
</section>
