name: sonarqube-pr

on:
  pull_request:
    branches:
      - master
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  analysis:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # write para que Sonar pueda decorar el PR

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Compile backend
        working-directory: DSW02-Practica01
        run: mvn -B -DskipTests compile

      - name: Validate Sonar token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "Falta configurar el secreto SONAR_TOKEN en el repositorio."
            exit 1
          fi

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.organization=ricardo2099
            -Dsonar.projectKey=Ricardo2099_DSWO2
            -Dsonar.projectName=DSWO2
            -Dsonar.sources=DSW02-Practica01/src/main/java,frontend/src
            -Dsonar.java.binaries=DSW02-Practica01/target/classes
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/cypress/results/**
 



            